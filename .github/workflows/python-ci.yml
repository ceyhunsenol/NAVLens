name: Python CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    name: Build native package and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Show toolchains
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Install development package
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check python

      - name: Check Python formatting
        run: python -m ruff format --check python

      - name: Build release wheel
        run: python -m maturin build --release --locked --out dist

      - name: Verify installed release wheel
        shell: bash
        run: |
          python -m pip uninstall -y navlens
          python -m pip install dist/*.whl
          python -c "import navlens; from importlib.metadata import version; assert navlens.__version__ == version('navlens'); assert navlens.__version__ != '0+unknown'"
          python - <<'PY'
          import subprocess
          from importlib.metadata import distribution

          entry_points = sorted(
              (
                  entry_point
                  for entry_point in distribution("navlens").entry_points
                  if entry_point.group == "console_scripts"
              ),
              key=lambda entry_point: entry_point.name,
          )
          if not entry_points:
              raise SystemExit("release wheel does not publish any console scripts")

          for entry_point in entry_points:
              result = subprocess.run(
                  [entry_point.name, "--help"],
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"{entry_point.name} --help failed:\n{result.stderr}"
                  )

          print(f"verified {len(entry_points)} installed console scripts")
          PY
          navlens-evaluate-historical-prediction-csv \
            --schedule-csv examples/historical_prediction/prediction_schedule.csv \
            --fund-unit-prices-csv examples/historical_prediction/fund_unit_prices.csv \
            --fund-id DEMO \
            --source-id example \
            --lookback 5 \
            --confidence-level 0.95 \
            --model-version v1.0 \
            --output-format json
