name: Python CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    name: Build native package and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Show toolchains
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Install development package
        run: python -m pip install -e ".[dev]"

      - name: Run Python tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check python .github/scripts

      - name: Check Python formatting
        run: python -m ruff format --check python .github/scripts

      - name: Build release wheel
        run: python -m maturin build --release --locked --out dist

      - name: Verify installed release wheel
        shell: bash
        run: |
          python -m pip uninstall -y navlens
          python -m pip install dist/*.whl
          expected_version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          python .github/scripts/verify_installed_package.py --expected-version "${expected_version}"
