[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "navlens"
dynamic = ["version"]
description = "Explainable investment-fund return research powered by Rust and Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NAVLens contributors" }]
keywords = [
    "backtesting",
    "finance",
    "investment-funds",
    "pyo3",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/ceyhunsenol/NAVLens"
Repository = "https://github.com/ceyhunsenol/NAVLens"
Issues = "https://github.com/ceyhunsenol/NAVLens/issues"
Changelog = "https://github.com/ceyhunsenol/NAVLens/blob/master/CHANGELOG.md"

[project.scripts]
navlens-align-holdings-csv = "navlens.alignment.cli:main"
navlens-return-contribution-csv = "navlens.alignment.return_contribution_cli:main"
navlens-fx-return-contribution-csv = "navlens.alignment.fx_return_contribution_cli:main"
navlens-backtest-tefas = "navlens.evaluation.tefas_cli:main"
navlens-backtest-batch = "navlens.evaluation.tefas_batch_cli:main"
navlens-fetch-tefas = "navlens.sources.tefas.cli:main"
navlens-reconcile-fund-csv = "navlens.reconciliation.cli:main"
navlens-fx-reconcile-fund-csv = "navlens.reconciliation.fx_cli:main"
navlens-evaluate-historical-reconciliation-csv = "navlens.reconciliation.historical_cli:main"
navlens-evaluate-historical-fx-reconciliation-csv = "navlens.reconciliation.historical_fx_cli:main"
navlens-predict-fund-csv = "navlens.prediction.cli:main"
navlens-predict-tefas = "navlens.prediction.tefas_cli:main"
navlens-predict-tefas-batch = "navlens.prediction.tefas_batch_cli:main"
navlens-evaluate-historical-prediction-csv = "navlens.prediction.historical_cli:main"
navlens-evaluate-tefas-prediction = "navlens.prediction.tefas_evaluation_cli:main"
navlens-evaluate-tefas-prediction-batch = "navlens.prediction.tefas_evaluation_batch_cli:main"
navlens-summarize-prediction-evaluations = "navlens.prediction.live_history_cli:main"


[project.optional-dependencies]
dev = [
    "maturin>=1.9,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]
[tool.maturin]
manifest-path = "crates/navlens-python/Cargo.toml"
python-source = "python"
module-name = "navlens._native"
bindings = "pyo3"
features = ["extension-module"]
locked = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
